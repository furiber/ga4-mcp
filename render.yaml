# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Render asks for the `sync: false` values.
services:
  - type: web
    name: ga4-mcp
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: ga4-mcp remote --host 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
