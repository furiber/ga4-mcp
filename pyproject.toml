[project]
name = "ga4-mcp"
version = "0.1.0"
description = "Read-only MCP server for Google Analytics 4 reporting, authenticated with the user's own Google credentials."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "google-analytics-data>=0.18",
    "google-analytics-admin>=0.23",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    # remote (HTTP / Vercel) mode
    "cryptography>=42",
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
ga4-mcp = "ga4_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ga4_mcp"]
